# CI — Client (Rust + Bevy)
# Temporarily disabled: trigger is manual only.
# To re-enable, replace the `on` block with:
#   on:
#     push:
#       branches: [main, experimental, dev]
#       paths: [client/**]
#     pull_request:
#       paths: [client/**]

name: CI — Client

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client -> target

      - name: Check formatting
        run: cargo fmt --check
        working-directory: client

      - name: Clippy
        run: cargo clippy -- -D warnings
        working-directory: client

      - name: Build
        run: cargo build --release
        working-directory: client

      - name: Test
        run: cargo test
        working-directory: client
