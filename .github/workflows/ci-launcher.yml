# CI — Launcher (Rust + Iced)
# Temporarily disabled: trigger is manual only.
# To re-enable, replace the `on` block with:
#   on:
#     push:
#       branches: [main, experimental, dev]
#       paths: [launcher/**]
#     pull_request:
#       paths: [launcher/**]

name: CI — Launcher

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (arm64) — the launcher's macOS target
        # (aarch64-apple-darwin), so this leg builds/tests natively.
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher -> target

      - name: Check formatting
        run: cargo fmt --check
        working-directory: launcher

      - name: Clippy
        run: cargo clippy -- -D warnings
        working-directory: launcher

      - name: Build
        run: cargo build --release
        working-directory: launcher

      - name: Test
        run: cargo test
        working-directory: launcher
