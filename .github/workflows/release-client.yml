# Release — Client (Godot 4.6.3 + C# / .NET 8)
# Temporarily disabled: trigger is manual only.
# To re-enable, replace the `on` block with:
#   on:
#     push:
#       tags: ['v*.*.*']

name: Release — Client

on:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.6.3"

jobs:
  build:
    name: Export Linux + Windows
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install .NET 8 SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y dotnet-sdk-8.0 unzip
          dotnet --list-sdks

      - name: Cache Godot editor
        id: cache-godot
        uses: actions/cache@v5
        with:
          path: /opt/godot-mono
          key: godot-mono-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Install Godot ${{ env.GODOT_VERSION }} (.NET)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64" /opt/godot-mono
          sudo chmod +x "/opt/godot-mono/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"

      - name: Link godot to PATH
        run: |
          sudo ln -sf "/opt/godot-mono/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Cache export templates
        id: cache-templates
        uses: actions/cache@v5
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-mono

      - name: Install export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          unzip -q templates.tpz -d /tmp/godot-templates
          mv "/tmp/godot-templates/templates" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"

      - name: Read version from project.godot
        id: version
        run: |
          v=$(grep '^config/version' client/project.godot | cut -d'"' -f2)
          if [ -z "$v" ]; then echo "config/version missing"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building Briska Blast client v$v"

      - name: dotnet build (sanity check)
        run: dotnet build --configuration Release
        working-directory: client

      - name: Pre-import resources
        run: godot --headless --import
        working-directory: client

      - name: Export Linux/X11
        run: |
          mkdir -p export/linux
          godot --headless --export-release "Linux/X11" "$PWD/export/linux/BriskaBlast.x86_64"
        working-directory: client

      - name: Export Windows Desktop
        run: |
          mkdir -p export/windows
          godot --headless --export-release "Windows Desktop" "$PWD/export/windows/BriskaBlast.exe"
        working-directory: client

      - name: Package Linux tar.gz
        run: |
          cd client/export/linux
          tar czf "../../../briskablast-client-${{ steps.version.outputs.version }}-linux.tar.gz" .

      - name: Package Windows zip
        run: |
          cd client/export/windows
          zip -qr "../../../briskablast-client-${{ steps.version.outputs.version }}-windows.zip" .

      - uses: actions/upload-artifact@v7
        with:
          name: briskablast-client-${{ steps.version.outputs.version }}
          path: |
            briskablast-client-*-linux.tar.gz
            briskablast-client-*-windows.zip
