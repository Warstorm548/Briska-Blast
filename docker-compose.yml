services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: redis://redis:6379
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: info
      MIN_GAME_VERSION: 0.1.0
      ADMIN_PASSWORD: "@admin"
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: always

volumes:
  redis_data:
