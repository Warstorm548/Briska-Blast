services:
  server:
    image: ghcr.io/warstorm548/briska-blast:${RELEASE_CHANNEL:?RELEASE_CHANNEL must be set in .env (stable|ea|dev)}
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        - RELEASE_CHANNEL=${RELEASE_CHANNEL:?RELEASE_CHANNEL must be set in .env (stable|ea|dev)}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${GAME_PORT:-25919}:${GAME_PORT:-25919}"
      - "${BIND_ADDR:-127.0.0.1}:${ADMIN_PORT:-25920}:${ADMIN_PORT:-25920}"
    environment:
      - GAME_PORT=${GAME_PORT:-25919}
      - ADMIN_PORT=${ADMIN_PORT:-25920}
      - REDIS_URL=redis://redis:6379
      - RUST_LOG=info
      - MIN_GAME_VERSION=0.1.0
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-@admin}
      - WATCHTOWER_URL=http://watchtower:${WATCHTOWER_PORT:-25921}
      # No default token here — must be supplied via .env. Falling back to a
      # known-literal token would mean a missing .env silently runs with a
      # public secret. Fail-closed is safer.
      - WATCHTOWER_TOKEN=${WATCHTOWER_TOKEN:?WATCHTOWER_TOKEN must be set in .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: always

  watchtower:
    # Pinned: never run :latest in production. A breaking or malicious
    # upstream release would otherwise auto-deploy on next pull.
    #
    # Image source: containrrr/watchtower was archived Dec 2025 and its
    # last release (1.7.1) only speaks Docker API 1.25 — modern Docker
    # Engine (28+) requires >= 1.44, so the original image no longer
    # negotiates with current daemons. nickfedor/watchtower is the
    # actively-maintained continuation fork (github.com/nicholas-fedor/
    # watchtower); it autonegotiates the API version. Env vars and CLI
    # flags below are unchanged from the containrrr image.
    image: nickfedor/watchtower:1.17.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_TOKEN:?WATCHTOWER_TOKEN must be set in .env}
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_PORT=${WATCHTOWER_PORT:-25921}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      # Required so the rollback flow's local retag in server/src/update/docker.rs
      # is not silently overwritten by Watchtower pulling the registry's newer
      # channel image on its next trigger. The server pre-pulls images itself
      # via bollard on the auto-apply path to compensate.
      - WATCHTOWER_NO_PULL=true
    command: --http-api-periodic-polls
    # Internal-network only — never `ports:`. Publishing the Watchtower HTTP
    # API to the host (even loopback) is a privileged-endpoint exposure: the
    # token is the only thing standing between an on-host attacker and a
    # forced container restart. `expose:` keeps it reachable only from other
    # containers on the same Docker network.
    expose:
      - "${WATCHTOWER_PORT:-25921}"
    restart: always

volumes:
  redis_data:
