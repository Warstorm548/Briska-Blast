[package]
name = "launcher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "launcher"
path = "src/main.rs"

[dependencies]
iced               = { version = "0.14", features = ["tokio"] }
serde              = { version = "1",    features = ["derive"] }
serde_json         = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3",  features = ["env-filter"] }
dotenvy            = "0.15"
shared             = { path = "../shared" }
