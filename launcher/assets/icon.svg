<?xml version="1.0" encoding="UTF-8"?>
<!-- BriskaBlast Launcher — placeholder logo.
     Replace with final art before public release.
     Source of truth for icon.png (AppImage / .deb) and icon.ico (NSIS).
     If you edit this, regenerate the rasters via tools/build/gen-icon.py. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="blast" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFE082"/>
      <stop offset="55%"  stop-color="#FFAA00"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </radialGradient>
  </defs>
  <!-- Background: rounded-corner dark navy square. -->
  <rect x="0" y="0" width="512" height="512" rx="72" ry="72" fill="#1A2238"/>
  <!-- Outer white accent ring. -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-opacity="0.85"/>
  <!-- Blast — radial orange. -->
  <circle cx="256" cy="256" r="150" fill="url(#blast)"/>
  <!-- Inner highlight. -->
  <circle cx="220" cy="220" r="38" fill="#FFFFFF" fill-opacity="0.28"/>
  <!-- Letters: "BB" in white, centered. -->
  <text x="256" y="296"
        text-anchor="middle"
        font-family="'DejaVu Sans', 'Liberation Sans', sans-serif"
        font-weight="900"
        font-size="160"
        fill="#1A2238"
        stroke="#FFFFFF"
        stroke-width="4"
        paint-order="stroke">BB</text>
</svg>
