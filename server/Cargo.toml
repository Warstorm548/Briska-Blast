[package]
name = "server"
version = "0.36.2"
edition = "2021"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
axum            = { version = "0.7", features = ["json", "macros", "ws"] }
tokio           = { version = "1",   features = ["full"] }
deadpool-redis  = "0.15"
redis           = { version = "0.25", features = ["aio", "tokio-comp"] }
serde           = { version = "1",   features = ["derive"] }
serde_json      = "1"
rand            = "0.8"
sha2            = "0.10"
hmac            = "0.12"
hex             = "0.4"
regex           = "1"
base64          = "0.22"
# OIDC id_token verification (admin/oidc.rs). >= 10.3 required for the
# claim type-confusion fix (Dependabot #13/#14). 10.x makes the crypto backend
# explicit: aws_lc_rs, not rust_crypto, because rust_crypto pulls the `rsa`
# crate and its unpatched Marvin timing advisory.
jsonwebtoken    = { version = "10.3", features = ["aws_lc_rs"] }
tower           = "0.4"
tower-http      = { version = "0.5", features = ["trace"] }
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy         = "0.15"
semver          = "1.0"
governor        = "0.6"
bcrypt          = "0.15"
reqwest         = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
chrono          = { version = "0.4", features = ["serde"] }
bollard         = "0.17"
futures-util    = "0.3"
urlencoding     = "2"
shared          = { path = "../shared" }
