[package]
name = "server"
version = "0.16.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
axum            = { version = "0.7", features = ["json", "macros", "ws"] }
tokio           = { version = "1",   features = ["full"] }
deadpool-redis  = "0.15"
redis           = { version = "0.25", features = ["aio", "tokio-comp"] }
serde           = { version = "1",   features = ["derive"] }
serde_json      = "1"
rand            = "0.8"
sha2            = "0.10"
hex             = "0.4"
tower           = "0.4"
tower-http      = { version = "0.5", features = ["trace"] }
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy         = "0.15"
semver          = "1.0"
governor        = "0.6"
bcrypt          = "0.15"
reqwest         = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
chrono          = { version = "0.4", features = ["serde"] }
bollard         = "0.17"
futures-util    = "0.3"
urlencoding     = "2"
shared          = { path = "../shared" }
